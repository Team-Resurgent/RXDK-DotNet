name: Build RXDK-DotNet

# Windows build of the full title (native runtime, managed assemblies, XBE, ISO),
# then the same rolling "latest" release RXDK-Tools uses: a push to main deletes
# and recreates the latest tag so /releases/latest is always this build.
# A v* tag is a fixed release. workflow_dispatch with release_tag is a prerelease.
# Pull requests build and upload artifacts, and do not publish.

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init class library source submodules
        shell: bash
        run: |
          set -euo pipefail
          git -C vendor/mono submodule update --init --depth 1 \
            external/corefx external/corert external/binary-reference-assemblies
          git -C vendor/monogame submodule update --init --depth 1 \
            ThirdParty/StbImageSharp ThirdParty/StbImageWriteSharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0 runs dotnet-mgcb, which the MonoGame sample's content build installs.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Stage RXDK clang, SDK, and host tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\RXDK'
          New-Item -ItemType Directory -Force -Path "$root\llvm", "$root\tools" | Out-Null

          $llvmZip = Join-Path $env:RUNNER_TEMP 'xbox-windows-x64.zip'
          Write-Host 'downloading RXDK clang'
          curl.exe -fsSL -o $llvmZip https://github.com/Team-Resurgent/llvm-project/releases/download/latest/xbox-windows-x64.zip
          tar.exe -xf $llvmZip -C "$root\llvm"
          if (-not (Test-Path "$root\llvm\xbox-windows-x64\bin\clang.exe")) {
            throw 'clang.exe missing after extracting xbox-windows-x64.zip'
          }

          if (-not (Test-Path "$root\sdk\include")) {
            git clone --depth 1 https://github.com/Team-Resurgent/RXDK-SDK.git "$root\sdk"
          }
          if (-not (Test-Path "$root\sdk\lib\libxapi.lib")) {
            throw 'RXDK-SDK libxapi.lib missing'
          }

          $toolsZip = Join-Path $env:RUNNER_TEMP 'rxdk-tools.zip'
          $toolsExtract = Join-Path $env:RUNNER_TEMP 'rxdk-tools'
          New-Item -ItemType Directory -Force -Path $toolsExtract | Out-Null
          curl.exe -fsSL -o $toolsZip https://github.com/Team-Resurgent/RXDK-Tools/releases/download/latest/rxdk-managed-win-x64.zip
          tar.exe -xf $toolsZip -C $toolsExtract
          $imagebld = Get-ChildItem $toolsExtract -Recurse -Filter imagebld.exe | Select-Object -First 1
          if (-not $imagebld) { throw 'imagebld.exe missing from the RXDK-Tools release' }
          Copy-Item $imagebld.FullName -Destination "$root\tools\imagebld.exe" -Force

          # xdvdfs is published by XDVDFS-TR, not RXDK-Tools. Asset names carry a commit suffix.
          $xdvdfsMeta = Join-Path $env:RUNNER_TEMP 'xdvdfs-release.json'
          curl.exe -fsSL -o $xdvdfsMeta https://api.github.com/repos/Team-Resurgent/XDVDFS-TR/releases/latest
          $xdvdfsAsset = (Get-Content $xdvdfsMeta -Raw | ConvertFrom-Json).assets |
            Where-Object { $_.name -like 'xdvdfs-windows-x64-*.zip' } |
            Select-Object -First 1
          if (-not $xdvdfsAsset) { throw 'xdvdfs-windows-x64 zip missing from the XDVDFS-TR release' }
          $xdvdfsZip = Join-Path $env:RUNNER_TEMP 'xdvdfs.zip'
          $xdvdfsExtract = Join-Path $env:RUNNER_TEMP 'xdvdfs'
          New-Item -ItemType Directory -Force -Path $xdvdfsExtract | Out-Null
          curl.exe -fsSL -o $xdvdfsZip $xdvdfsAsset.browser_download_url
          tar.exe -xf $xdvdfsZip -C $xdvdfsExtract
          $xdvdfs = Get-ChildItem $xdvdfsExtract -Recurse -Filter xdvdfs.exe | Select-Object -First 1
          if (-not $xdvdfs) { throw 'xdvdfs.exe missing from the XDVDFS-TR zip' }
          Copy-Item $xdvdfs.FullName -Destination "$root\tools\xdvdfs.exe" -Force

      - name: Build runtime, assemblies, and ISO
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-eglib.sh
          bash scripts/build-utils.sh
          bash scripts/build-metadata.sh
          bash scripts/build-mini.sh
          bash scripts/build-corlib.sh
          bash scripts/build-bcl.sh
          bash scripts/build-input.sh
          bash scripts/build-kernel.sh
          bash scripts/build-graphics.sh
          bash scripts/build-sdklibs.sh
          bash scripts/build-monogame.sh
          bash scripts/build-gum.sh
          bash scripts/build-testasm.sh
          bash scripts/build-minitests.sh
          bash scripts/build-host.sh
          for f in libeglib.lib libmonoutils.lib libmonoruntime.lib libmini.lib; do
            test -f "build-out/lib/$f"
          done
          for f in mscorlib.dll System.dll System.Core.dll System.Numerics.Vectors.dll System.Runtime.Serialization.dll System.Drawing.Primitives.dll System.Net.Http.dll MonoGame.Framework.dll FlatRedBall.InterpolationCore.dll GumCommon.dll MonoGameGum.dll generics-variant-types.dll Rxdk.Input.dll Rxdk.Kernel.dll Rxdk.Graphics.dll Rxdk.Audio.dll Rxdk.Music.dll Rxdk.Xact.dll Rxdk.Video.dll Rxdk.Uix.dll Rxdk.Online.dll Rxdk.Voice.dll Main.dll; do
            test -f "build-out/corlib/$f"
          done
          n=$(ls build-out/corlib/mini-*.dll | wc -l | tr -d '[:space:]')
          test "$n" = 15
          test -f build-out/obj/host/RxdkMonoHost.iso
          test -f build-out/obj/host/mono-host.xbe
          if ! grep -q 'libd3d8' build-out/obj/host/sdk-extra-libs.txt; then
            echo "graphics title did not link libd3d8"
            exit 1
          fi
          if ! grep -q 'libxgraphics' build-out/obj/host/sdk-extra-libs.txt; then
            echo "graphics title did not link libxgraphics"
            exit 1
          fi
          if ! grep -q 'libd3dx8' build-out/obj/host/sdk-extra-libs.txt; then
            echo "graphics title did not link libd3dx8"
            exit 1
          fi
          for l in libdsound libdmusic libxact libxmv libuix libxonline libxneto; do
            if ! grep -q "$l" build-out/obj/host/sdk-extra-libs.txt; then
              echo "title did not link $l"
              exit 1
            fi
          done
          # libxbdm binds xbdm.dll by ordinal; a title linking it cannot load.
          if grep -q 'libxbdm' build-out/obj/host/sdk-extra-libs.txt; then
            echo "libxbdm must never be linked"
            exit 1
          fi

      - name: ISA gate (PIII-clean)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install capstone
          python tools/isa-scan.py build-out

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/runtime/lib, dist/runtime/assemblies | Out-Null
          Copy-Item build-out/lib/*.lib dist/runtime/lib
          Copy-Item build-out/corlib/*.dll dist/runtime/assemblies
          # A consumer needs the props/targets to build a title project against this runtime.
          New-Item -ItemType Directory -Force -Path dist/runtime/msbuild | Out-Null
          Copy-Item msbuild/*.props, msbuild/*.targets dist/runtime/msbuild
          Compress-Archive -Path dist/runtime/lib, dist/runtime/assemblies, dist/runtime/msbuild -DestinationPath dist/rxdk-dotnet-runtime.zip -Force
          Copy-Item build-out/obj/host/RxdkMonoHost.iso dist/RxdkMonoHost.iso
          Copy-Item build-out/obj/host/mono-host.xbe dist/RxdkMonoHost.xbe
          Remove-Item -Recurse -Force dist/runtime

      # Builds the sample the way a consumer does: against an unzipped release rather than the
      # checkout's build-out. Covers the msbuild files, the zip layout, and the xdvdfs fetch.
      - name: Build a title with dotnet build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'rxdk-runtime'
          Expand-Archive dist/rxdk-dotnet-runtime.zip -DestinationPath $runtime -Force
          foreach ($f in 'msbuild/Rxdk.Title.props', 'msbuild/Rxdk.Title.targets', 'assemblies/mscorlib.dll') {
            if (-not (Test-Path (Join-Path $runtime $f))) { throw "$f missing from rxdk-dotnet-runtime.zip" }
          }
          # RxdkXbe resolves to RxdkMonoHost.xbe beside assemblies/, which is where the release
          # tells you to put it.
          Copy-Item dist/RxdkMonoHost.xbe $runtime

          dotnet build samples/HelloXbox/HelloXbox.csproj -t:RxdkPack -p:RxdkRuntimeDir=$runtime
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build of the sample title failed' }

          $out = 'samples/HelloXbox/bin/Debug'
          foreach ($f in "$out/Main.dll", "$out/disc/default.xbe", "$out/disc/assemblies/Main.dll", "$out/HelloXbox.iso") {
            if (-not (Test-Path $f)) { throw "$f was not produced" }
          }
          # The host rejects a Main.dll with no entry point, so make sure it is not a library:
          # IMAGE_FILE_DLL in the COFF characteristics, at e_lfanew + 4 + 18.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path "$out/Main.dll"))
          $coff = [BitConverter]::ToInt32($bytes, 0x3c) + 4
          if ([BitConverter]::ToUInt16($bytes, $coff + 18) -band 0x2000) {
            throw 'Main.dll was built as a library; the host needs an entry point'
          }

      # The MonoGame sample, also against the unzipped release. Its content goes through MGCB on
      # the runner, so this covers the framework in the zip and the content staging too.
      - name: Build the MonoGame sample title
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'rxdk-runtime'
          $project = 'vendor/monogame-samples/Platformer2D/Platformer2D.Xbox'
          dotnet build "$project/Platformer2D.Xbox.csproj" -t:RxdkPack -p:RxdkRuntimeDir=$runtime
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build of Platformer2D failed' }

          $out = "$project/bin/Debug"
          foreach ($f in "$out/Platformer2D.Xbox.iso", "$out/disc/default.xbe",
                         "$out/disc/assemblies/Main.dll", "$out/disc/assemblies/MonoGame.Framework.dll",
                         "$out/disc/Content/Levels/0.txt", "$out/disc/Content/Sprites/Gem.xnb") {
            if (-not (Test-Path $f)) { throw "$f was not produced" }
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rxdk-dotnet
          path: |
            dist/RxdkMonoHost.iso
            dist/RxdkMonoHost.xbe
            dist/rxdk-dotnet-runtime.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: GitHub Release
    needs: [build]
    if: |
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: rxdk-dotnet
          path: dist

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          moving=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
            prerelease=true
          else
            # Push to main: one moving "latest" release so /releases/latest stays current.
            tag="latest"
            prerelease=false
            moving=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (prerelease=$prerelease, moving=$moving)"

      - name: Move the 'latest' tag/release to this build
        if: steps.meta.outputs.moving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RXDK-DotNet ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          body: |
            Bootable title and the prebuilt runtime.

            - `RxdkMonoHost.iso` — boot on xemu (`-dvd_path` this file, `-device lpc47m157 -serial stdio`)
            - `RxdkMonoHost.xbe` — the title image inside that ISO
            - `rxdk-dotnet-runtime.zip` — `lib/` (libeglib, libmonoutils, libmonoruntime, libmini), `assemblies/` (mscorlib, System, System.Core, System.Numerics.Vectors, System.Runtime.Serialization, MonoGame.Framework, Rxdk.Input, Rxdk.Kernel, Rxdk.Graphics, Rxdk.Audio, Rxdk.Music, Rxdk.Xact, Rxdk.Video, Rxdk.Uix, Rxdk.Online, Rxdk.Voice, and Main.dll), and `msbuild/` (import these from a .csproj to build and pack a title with `dotnet build`)
          files: |
            dist/*
