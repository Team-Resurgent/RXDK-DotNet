name: Clean old workflow runs

# Deletes Actions runs older than 12 hours so the run list does not keep every build.
# Schedule is every 6 hours; workflow_dispatch runs it immediately.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clean:
    name: Delete runs older than 12 hours
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting workflow runs created before $cutoff"
          ids=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.created_at < "'"$cutoff"'") | select(.status != "in_progress" and .status != "queued" and .status != "waiting") | .id')
          if [ -z "$ids" ]; then
            echo "No runs to delete."
            exit 0
          fi
          n=0
          for id in $ids; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null
            n=$((n + 1))
          done
          echo "Deleted $n run(s)."
